<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>无权访问</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#f5f6f8;color:#222}
  .card{max-width:22rem;margin:1rem;padding:2rem;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
  a{color:#2563eb}
  @media (prefers-color-scheme:dark){body{background:#15171a;color:#e6e6e6}.card{background:#1f2227}a{color:#7aa7ff}}
</style>
</head>
<body>
<div class="card">
  <h1 style="font-size:1.2rem;margin:0 0 .8rem">当前账号无权访问这个应用</h1>
  <p style="margin:0 0 1rem">正在退出当前账号，并跳转到登录页，请换有权限的账号登录。</p>
  <p style="margin:0;font-size:.9rem"><a id="go" href="#">没有自动跳转？点这里</a></p>
</div>
<script>
(function () {
  // 这个页面是 Traefik 在「用户原本要访问的地址」上直接返回的，所以 location.href 就是原地址（含查询串）
  var rd = location.href;
  // 登录页域名：把当前域名的第一段换成 auth（app.example.com -> auth.example.com）
  var parts = location.hostname.split('.'); parts[0] = 'auth';
  var target = 'https://' + parts.join('.') + '/logout?rd=' + encodeURIComponent(rd);
  document.getElementById('go').href = target;
  location.replace(target);
})();
</script>
</body>
</html>
