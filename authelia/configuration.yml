# Authelia 配置（不含任何密钥；密钥通过 AUTHELIA_*_FILE 环境变量从 Docker secrets 读取）
theme: auto

server:
  address: tcp://0.0.0.0:9091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth
        # 只认登录 cookie，忽略请求里的 Authorization 头。否则浏览器缓存的旧 Basic 凭据会被当成一次登录尝试，
        # 校验失败后返回 401 + WWW-Authenticate: Basic，浏览器就会弹出原生的 Basic 登录框，而不是跳转到登录页。
        authn_strategies:
          - name: CookieSession

log:
  level: info

authentication_backend:
  # 用户与分组在 lldap（LDAP 目录，存 Postgres）里管理。base_dn 与绑定账号 DN 属于站点配置，在 local.yml。
  ldap:
    implementation: lldap
    address: ldap://lldap:3890
  # 改密码、重置密码都在 lldap 管理界面里做，Authelia 网页上不提供
  password_reset:
    disable: true
  password_change:
    disable: true

# access_control、session.cookies、ldap 的 base_dn/绑定 DN（域名与分组名）见 local.yml，示例见 local.yml.example
# 会话存 Redis（authelia-redis，仅 authelia 能访问）；session.cookies（域名）在 local.yml
session:
  redis:
    host: authelia-redis
    port: 6379

regulation:
  max_retries: 5
  find_time: 5m
  ban_time: 15m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

