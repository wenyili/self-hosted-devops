# Authelia 配置（不含任何密钥；密钥通过 AUTHELIA_*_FILE 环境变量从 Docker secrets 读取）
theme: auto

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml
  password_reset:
    disable: true

# access_control 与 session.cookies（域名、用户名）见 local.yml，示例见 local.yml.example
regulation:
  max_retries: 5
  find_time: 5m
  ban_time: 15m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

