networks:
  traefik:
    external: true
  internal:
    driver: bridge

volumes:
  traefik_acme:
  portainer_data:
  postgres_data:
  minio_data:
  gitea_data:
  gitea_runner_data:
  backup_data:
  pgadmin_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  traefik_users:
    file: ./secrets/traefik_users.txt
  gitea_db_password:
    file: ./secrets/gitea_db_password.txt
  alicloud_access_key:
    file: ./secrets/alicloud_access_key.txt
  alicloud_secret_key:
    file: ./secrets/alicloud_secret_key.txt
  registry_htpasswd:
    file: ./secrets/registry_htpasswd.txt

services:
  # Traefik - 反向代理和SSL证书管理
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    secrets:
      - traefik_users
    command:
      # 启用Docker提供者
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      
      # 配置入口点
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      
      # 启用ACME (Let's Encrypt) - 从环境变量读取邮箱
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      
      # 启用API和控制台
      - --api.dashboard=true
      - --api.insecure=true
      
      # 日志配置
      - --log.level=INFO
      - --accesslog=true
      - --log.format=json
      
      # 全局HTTP到HTTPS重定向
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      # 基本认证中间件
      - "traefik.http.middlewares.traefik-auth.basicauth.usersfile=/run/secrets/traefik_users"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"

  # Portainer - Docker容器管理界面
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${BASE_DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  # PostgreSQL - 关系型数据库
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    secrets:
      - postgres_password
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3兼容对象存储
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    secrets:
      - minio_root_password
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER_REDIRECT_URL: https://minio-console.${BASE_DOMAIN}
    volumes:
      - minio_data:/data
    networks:
      - traefik
      - internal
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      # MinIO API
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`minio.${BASE_DOMAIN}`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      
      # MinIO Console
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.${BASE_DOMAIN}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  # Gitea - Git仓库服务
  gitea:
    image: gitea/gitea:1.21
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD_FILE=/run/secrets/gitea_db_password
      - GITEA__server__DOMAIN=git.${BASE_DOMAIN}
      - GITEA__server__SSH_DOMAIN=git.${BASE_DOMAIN}
      - GITEA__server__ROOT_URL=https://git.${BASE_DOMAIN}
      # 临时：允许通过 IP+HTTP 访问时保持会话（避免 Secure Cookie 导致登录循环）
      - GITEA__session__COOKIE_SECURE=false
      - GITEA__session__DOMAIN=
      - GITEA__actions__ENABLED=true
      - GITEA__actions__DEFAULT_ACTIONS_URL=https://github.com
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    networks:
      - traefik
      - internal
    depends_on:
      - postgres
    secrets:
      - gitea_db_password
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`git.${BASE_DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls.certresolver=letsencrypt"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gitea Actions Runner
  gitea-runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitea_runner_data:/data
    networks:
      - internal
    dns_search: ["."]
    depends_on:
      - gitea
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN:-please_set_runner_token}
      - GITEA_RUNNER_NAME=docker-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04,ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04,ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04
      - GITEA_RUNNER_SCOPE=global

  # Docker Registry - 私有镜像仓库
  registry:
    image: registry:2.8
    container_name: registry
    restart: unless-stopped
    volumes:
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./registry/entrypoint.sh:/entrypoint.sh:ro
      - ./secrets/registry_htpasswd.txt:/auth/htpasswd:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - traefik
      - internal
    dns_search: ["."]
    depends_on:
      - minio
    secrets:
      - minio_root_password
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.${BASE_DOMAIN}`)"
      - "traefik.http.routers.registry.entrypoints=websecure"
      - "traefik.http.routers.registry.tls.certresolver=letsencrypt"
      - "traefik.http.services.registry.loadbalancer.server.port=5000"
    healthcheck:
      disable: true

  # pgAdmin 4 - PostgreSQL 可视化管理
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    secrets:
      - pgadmin_password
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - traefik
      - internal
    # 同时支持域名访问与 IP+端口访问（默认 5050）
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${BASE_DOMAIN}`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
