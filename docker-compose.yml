# 日志轮转：每个容器最多保留 3 个 10MB 的日志文件，避免 json.log 无限增长
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  traefik:
    external: true
  internal:
    driver: bridge
  # 仅 authelia 与它的 redis 使用的隔离网络（internal: 无外网、其它容器接不进来），所以 redis 不需要密码
  auth:
    internal: true

volumes:
  traefik_acme:
  postgres_data:
  gitea_data:
  gitea_runner_data:
  backup_data:
  authelia_data:
  authelia_redis_data:
  lldap_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  gitea_db_password:
    file: ./secrets/gitea_db_password.txt
  alicloud_access_key:
    file: ./secrets/alicloud_access_key.txt
  alicloud_secret_key:
    file: ./secrets/alicloud_secret_key.txt
  authelia_jwt_secret:
    file: ./secrets/authelia_jwt_secret.txt
  authelia_session_secret:
    file: ./secrets/authelia_session_secret.txt
  authelia_storage_key:
    file: ./secrets/authelia_storage_key.txt
  lldap_jwt_secret:
    file: ./secrets/lldap_jwt_secret.txt
  lldap_key_seed:
    file: ./secrets/lldap_key_seed.txt
  lldap_admin_password:
    file: ./secrets/lldap_admin_password.txt
  authelia_ldap_password:
    file: ./secrets/authelia_ldap_password.txt

services:
  # Traefik - 反向代理和SSL证书管理
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    command:
      # 启用Docker提供者
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      
      # 配置入口点
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      
      # 启用ACME (Let's Encrypt) - 从环境变量读取邮箱
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      
      # 启用API和控制台
      - --api.dashboard=true
      
      # 日志配置
      - --log.level=INFO
      - --accesslog=true
      - --log.format=json
      
      # 全局HTTP到HTTPS重定向
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      # 控制台仅经 HTTPS 域名访问，由 Authelia 统一登录保护（不再开放 8080 端口）
      - "traefik.http.routers.traefik.middlewares=authelia@docker"

  # PostgreSQL - 关系型数据库
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    secrets:
      - postgres_password
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # 仅绑定回环地址：外网不可达，本机通过 `ssh -L 5432:localhost:5432` 隧道访问
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gitea - Git仓库服务
  gitea:
    image: gitea/gitea:1.21
    container_name: gitea
    restart: unless-stopped
    logging: *default-logging
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD_FILE=/run/secrets/gitea_db_password
      - GITEA__server__DOMAIN=git.${BASE_DOMAIN}
      - GITEA__server__SSH_DOMAIN=git.${BASE_DOMAIN}
      - GITEA__server__ROOT_URL=https://git.${BASE_DOMAIN}
      # 临时：允许通过 IP+HTTP 访问时保持会话（避免 Secure Cookie 导致登录循环）
      - GITEA__session__COOKIE_SECURE=false
      - GITEA__session__DOMAIN=
      - GITEA__actions__ENABLED=true
      - GITEA__actions__DEFAULT_ACTIONS_URL=https://github.com
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_SSH_PORT:-2222}:22"
    networks:
      - traefik
      - internal
    depends_on:
      - postgres
    secrets:
      - gitea_db_password
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`git.${BASE_DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls.certresolver=letsencrypt"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gitea Actions Runner
  gitea-runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitea_runner_data:/data
    networks:
      - internal
    dns_search: ["."]
    depends_on:
      - gitea
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN:-please_set_runner_token}
      - GITEA_RUNNER_NAME=docker-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04,ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04,ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04
      - GITEA_RUNNER_SCOPE=global

  # Gitea Backup - 定时打包 Gitea 数据 + 数据库并上传到阿里云 OSS
  gitea-backup:
    build: ./backup
    container_name: gitea-backup
    restart: unless-stopped
    logging: *default-logging
    init: true
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=gitea
      - PG_USER=gitea
      - BACKUP_ALL_DATABASES=1   # 同时导出 Postgres 里其它所有库（bread_admin、fishery_map、lldap …）
      - OSS_ENDPOINT=${OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}
      - OSS_BUCKET=${OSS_BUCKET}
      - OSS_PREFIX=${OSS_PREFIX:-gitea-backups}
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      - BACKUP_LOCAL_KEEP=${BACKUP_LOCAL_KEEP:-7}
    volumes:
      - gitea_data:/source/gitea_data:ro
      - backup_data:/backup
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal
    depends_on:
      - postgres
      - gitea
    secrets:
      - gitea_db_password
      - postgres_password
      - alicloud_access_key
      - alicloud_secret_key

  # lldap - 轻量 LDAP 用户目录：用户/分组/密码存在 Postgres（库 lldap）里，Authelia 通过 LDAP 登录校验。
  # 管理界面只监听服务器本机 127.0.0.1:17170，不经过 Traefik，通过 SSH 隧道访问：
  #   ssh -N -L 17170:127.0.0.1:17170 <服务器>   然后打开 http://localhost:17170
  lldap:
    image: lldap/lldap:v0.6.3-alpine
    container_name: lldap
    restart: unless-stopped
    logging: *default-logging
    environment:
      LLDAP_JWT_SECRET_FILE: /run/secrets/lldap_jwt_secret
      LLDAP_KEY_SEED_FILE: /run/secrets/lldap_key_seed
      # lldap 自己的管理员账号名（默认叫 admin，会和应用里的普通用户 admin 重名，所以改名）
      LLDAP_LDAP_USER_DN: lldap-admin
      LLDAP_LDAP_USER_PASS_FILE: /run/secrets/lldap_admin_password
      LLDAP_LDAP_BASE_DN: ${LLDAP_BASE_DN:?请在 .env 里设置，例如 dc=example,dc=com（运行 scripts/setup-lldap.sh 会自动生成）}
      LLDAP_DATABASE_URL: ${LLDAP_DATABASE_URL:?请在 .env 里设置（运行 scripts/setup-lldap.sh 会自动生成）}
    secrets:
      - lldap_jwt_secret
      - lldap_key_seed
      - lldap_admin_password
    volumes:
      - lldap_data:/data
    ports:
      - "127.0.0.1:17170:17170"
    networks:
      - auth        # 与 Authelia 的 LDAP 通信（3890 只在这个隔离网络里）
      - internal    # 连接 Postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Redis - 保存 Authelia 的登录会话（重启 Authelia 不会把所有人登出）
  authelia-redis:
    image: redis:7-alpine
    container_name: authelia-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - authelia_redis_data:/data
    networks:
      - auth
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Authelia - 统一登录（SSO），通过 forwardAuth 中间件 `authelia@docker` 保护各应用
  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    restart: unless-stopped
    logging: *default-logging
    # configuration.yml 为通用配置；local.yml（域名、用户名，不入库）与它合并加载
    command: ["--config", "/config/configuration.yml", "--config", "/config/local.yml"]
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_key
    secrets:
      - authelia_jwt_secret
      - authelia_session_secret
      - authelia_storage_key
    volumes:
      - ./authelia:/config
      - authelia_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traefik
      - auth
    depends_on:
      authelia-redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.${BASE_DOMAIN}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls.certresolver=letsencrypt"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      # 供各应用引用：traefik.http.routers.<app>.middlewares=authelia@docker,...
      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth"
      - "traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
